<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elshafey Ahmed, Portfolio</title>
<meta name="description" content="Elshafey Ahmed, senior graphic designer. Two portfolios, Bold and Calm." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Mrs+Saint+Delafield&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --blood: #8a0b0b; --blood-deep: #2a0506; --paper: #f7f2ec; --ink: #1a1414; --muted: #6f6461;
    --serif: 'Instrument Serif', 'Times New Roman', serif; --sans: 'Inter', system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 400; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blood); outline-offset: 4px; }

  .stage { min-height: 100%; display: flex; }
  .card { position: relative; flex: 1; background: var(--paper); display: flex; flex-direction: column; overflow: hidden; min-height: 100svh; }

  /* header */
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: clamp(18px, 3vw, 40px) clamp(18px, 4vw, 64px); }
  .burger { justify-self: start; width: 40px; height: 40px; display: grid; place-items: center; }
  .burger span { display: block; width: 30px; height: 1.5px; background: var(--ink); box-shadow: 0 -8px 0 var(--ink), 0 8px 0 var(--ink); }
  .brand { font-family: var(--serif); font-style: italic; font-size: clamp(1.8rem, 3.2vw, 2.6rem); line-height: 1; letter-spacing: -.01em; }
  .social { justify-self: end; display: flex; gap: clamp(10px, 1.6vw, 18px); align-items: center; }
  .social a { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; transition: background .2s ease, color .2s ease; }
  .social a:hover { background: var(--blood); color: var(--paper); }
  .social svg { width: 20px; height: 20px; }

  /* poster */
  .poster { flex: 1; position: relative; display: grid; place-items: center; padding: clamp(8px, 2vw, 24px) clamp(18px, 4vw, 64px) clamp(24px, 4vw, 56px); }
  h1 {
    font-family: var(--serif); font-weight: 400; color: var(--blood); text-transform: uppercase; text-align: center;
    font-size: clamp(2.6rem, min(13.5vw, 17svh), 13rem); line-height: .84; letter-spacing: -.02em;
  }
  h1 span { display: block; }
  h1 .sm { font-family: 'Mrs Saint Delafield', cursive; text-transform: none; font-size: 1em; line-height: 1.1; letter-spacing: 0; margin-top: .04em; }

  /* portfolio links under the title */
  .hero { display: flex; flex-direction: column; align-items: center; }
  .ways { margin-top: clamp(24px, 4svh, 48px); display: flex; align-items: baseline; gap: clamp(14px, 2vw, 24px); font-family: var(--serif); font-size: clamp(1.6rem, 2.6vw, 2.4rem); color: var(--ink); }
  .ways span { color: var(--muted); }
  .ways a { transition: color .2s ease; }
  .ways a:hover { color: var(--blood); font-style: italic; }

  /* menu */
  .menu { position: absolute; inset: 0; z-index: 10; background: var(--blood); color: var(--paper); display: flex; flex-direction: column; padding: clamp(18px, 3vw, 40px) clamp(18px, 4vw, 64px); }
  .menu[hidden] { display: none; }
  .menu .close { align-self: flex-start; width: 40px; height: 40px; position: relative; }
  .menu .close::before, .menu .close::after { content: ''; position: absolute; left: 5px; top: 19px; width: 30px; height: 1.5px; background: var(--paper); transform: rotate(45deg); }
  .menu .close::after { transform: rotate(-45deg); }
  .menu .groups { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-content: center; max-width: 980px; width: 100%; margin: 0 auto; }
  .menu h3 { font-size: .78rem; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; opacity: .75; padding-bottom: 12px; border-bottom: 1px solid rgba(247, 242, 236, .35); margin-bottom: 14px; }
  .menu li { list-style: none; }
  .menu .groups a { font-family: var(--serif); font-size: clamp(2.6rem, 6vw, 5rem); line-height: 1.05; display: inline-block; transition: transform .2s ease; }
  .menu .groups a:hover { transform: translateX(10px); font-style: italic; }

  @media (max-width: 760px) {
    .menu .groups { grid-template-columns: minmax(0, 1fr); }
    .brand { font-size: 1.35rem; white-space: nowrap; }
    .bar { gap: 10px; }
    .social { gap: 4px; }
    .social a { width: 30px; height: 30px; }
    .social svg { width: 17px; height: 17px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <header class="bar">
      <button type="button" class="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span></button>
      <p class="brand">Elshafey Ahmed</p>
      <nav class="social" aria-label="Social profiles">
        <a href="https://www.behance.net/Elshaf3i" target="_blank" rel="noopener" aria-label="Behance">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.6 11.4c.9-.4 1.4-1.2 1.4-2.2C10 7.3 8.6 6.5 6.8 6.5H2v11h5c2 0 3.6-1 3.6-3.1 0-1.4-.7-2.6-2-3zM4.3 8.3h2.2c.8 0 1.5.2 1.5 1.1 0 .8-.6 1.1-1.4 1.1H4.3V8.3zm2.5 7.4H4.3v-2.9h2.5c1 0 1.6.4 1.6 1.5s-.7 1.4-1.6 1.4zM18.2 9.6c-2.5 0-4.1 1.8-4.1 4.1 0 2.4 1.5 4.1 4.1 4.1 1.9 0 3.2-.9 3.8-2.7h-2c-.2.7-1 1-1.7 1-1.2 0-1.9-.7-2-1.9H22c.2-2.6-1.3-4.6-3.8-4.6zm-1.9 3.2c.1-1 .7-1.6 1.8-1.6 1 0 1.6.6 1.7 1.6h-3.5zM15.3 7h5.2v1.3h-5.2z"/></svg>
        </a>
        <a href="https://www.instagram.com/shaf3i.a.s/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".6" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/elshafey/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3v-11zm6.5 0h3.8v1.5h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1v5.46h-4v-4.84c0-1.16-.02-2.64-1.61-2.64-1.61 0-1.86 1.26-1.86 2.56v4.92h-4V9.75z"/></svg>
        </a>
      </nav>
    </header>

    <main class="poster">
      <div class="hero">
        <h1><span>Two</span><span>Personalities</span><span class="sm">One destination</span></h1>
        <nav class="ways" aria-label="Choose a portfolio"><a href="home.html">Bold</a><span aria-hidden="true">/</span><a href="calm/index.html">Calm</a></nav>
      </div>
    </main>


    <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <button type="button" class="close" aria-label="Close menu"></button>
      <div class="groups">
        <div>
          <h3>Portfolio</h3>
          <ul>
            <li><a href="home.html">Bold</a></li>
            <li><a href="calm/index.html">Calm</a></li>
          </ul>
        </div>
        <div>
          <h3>Contact</h3>
          <ul><li><a href="contact-me.html">Contact</a></li></ul>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var menu = document.getElementById('menu'), burger = document.querySelector('.burger'), close = menu.querySelector('.close');
    function open() { menu.hidden = false; burger.setAttribute('aria-expanded', 'true'); close.focus(); }
    function shut() { menu.hidden = true; burger.setAttribute('aria-expanded', 'false'); burger.focus(); }
    burger.addEventListener('click', open);
    close.addEventListener('click', shut);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) shut(); });
  })();
</script>
</body>
</html>
