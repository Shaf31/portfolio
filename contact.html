<section id="contact" class="contact-page">
  <div class="container">
    <h1 class="section-title">Get in touch</h1>
    <div class="contact-box">
      <form class="contact-form" id="contact-form">
        <fieldset class="cf-kind">
          <legend>I’m reaching out about</legend>
          <label><input type="radio" name="kind" value="Full-time role" required /> A full-time role</label>
          <label><input type="radio" name="kind" value="Freelance project" /> A freelance project</label>
          <label><input type="radio" name="kind" value="Something else" /> Something else</label>
        </fieldset>
        <div class="cf-pair">
          <div class="cf-field">
            <label for="cf-name">Name</label>
            <input type="text" id="cf-name" name="name" placeholder="Your name" required />
          </div>
          <div class="cf-field">
            <label for="cf-email">Email</label>
            <input type="email" id="cf-email" name="email" placeholder="you@example.com" required />
          </div>
        </div>
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" rows="4" placeholder="Tell me about your project..." required></textarea>
        <button type="submit" class="btn send-btn">Send by email</button>
      </form>
      <div class="cf-status" id="cf-status" role="status" hidden>
        <p><strong>Your email app should be opening with the message ready.</strong></p>
        <p>Nothing opened? <button type="button" class="cf-copy" id="cf-copy">Copy my email</button> or <a href="https://wa.me/201227525506" target="_blank" rel="noopener">message me on WhatsApp</a>.</p>
      </div>
      <p class="contact-alt">
        Or reach me directly at <a href="mailto:ellshaffey@outlook.com">ellshaffey@outlook.com</a>
        or on <a href="https://wa.me/201227525506" target="_blank" rel="noopener">WhatsApp, +20 122 752 5506</a>.
      </p>
    </div>
  </div>
</section>


<script>
  var form = document.getElementById('contact-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('cf-name').value.trim();
    var email = document.getElementById('cf-email').value.trim();
    var message = document.getElementById('cf-message').value.trim();
    var subject = encodeURIComponent(form.elements.kind.value + ' inquiry from ' + name);
    var body = encodeURIComponent(message + '\n\n— ' + name + ' (' + email + ')');
    document.getElementById('cf-status').hidden = false;
    window.location.href = 'mailto:ellshaffey@outlook.com?subject=' + subject + '&body=' + body;
  });
  document.getElementById('cf-copy').addEventListener('click', function () {
    var btn = this;
    navigator.clipboard.writeText('ellshaffey@outlook.com').then(
      function () { btn.textContent = 'Copied'; },
      function () { btn.textContent = 'Copy failed: ellshaffey@outlook.com'; }
    );
  });
</script>
</body>
