<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Work preview" hidden>
  <button type="button" class="lb-btn lb-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" class="lb-btn lb-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <figure>
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button type="button" class="lb-btn lb-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<script>
  (function () {
    var lb = document.getElementById('lightbox');
    var lbImg = document.createElement('img');
    lb.querySelector('figure').prepend(lbImg);
    var lbCap = document.getElementById('lb-cap');
    var current = [], index = 0, opener = null;

    function visibleItems() {
      return [].slice.call(document.querySelectorAll('.work-item')).filter(function (el) {
        return el.offsetParent !== null;
      });
    }
    function show(i) {
      index = (i + current.length) % current.length;
      var item = current[index];
      lb.classList.add('loading');
      lbImg.onload = function () { lb.classList.remove('loading'); };
      lbImg.src = item.dataset.full;
      lbImg.alt = item.querySelector('img').alt;
      lbCap.textContent = item.dataset.caption + ', ' + (index + 1) + ' of ' + current.length;
    }
    function open(item) {
      current = visibleItems();
      if (current.indexOf(item) === -1) current = [item];
      opener = item;
      lb.hidden = false;
      document.body.classList.add('lb-open');
      show(current.indexOf(item));
      lb.querySelector('.lb-close').focus();
    }
    function close() {
      lb.hidden = true;
      lbImg.removeAttribute('src');
      document.body.classList.remove('lb-open');
      if (opener) opener.focus();
    }

    [].forEach.call(document.querySelectorAll('.work-item'), function (item) {
      item.addEventListener('click', function () { open(item); });
    });
    lb.querySelector('.lb-close').addEventListener('click', close);
    lb.querySelector('.lb-prev').addEventListener('click', function () { show(index - 1); });
    lb.querySelector('.lb-next').addEventListener('click', function () { show(index + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function (e) {
      if (lb.hidden) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(index - 1);
      if (e.key === 'ArrowRight') show(index + 1);
      if (e.key === 'Tab') {
        var f = lb.querySelectorAll('button'), first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
  })();
</script>
